# Example vhost for the server. Copy to
# /etc/nginx/sites-available/mortgage2go, symlink it into sites-enabled,
# `nginx -t && systemctl reload nginx`, then:
#
#   certbot --nginx -d mortgage2go.mayersoftwaredevelopment.nl
#
# Certbot edits this file in place: it adds the listen 443 block with the
# certificate paths and turns the port 80 server into a redirect. So this is
# plain HTTP on purpose — do not add TLS here by hand first.

server {
    listen 80;
    listen [::]:80;
    server_name mortgage2go.mayersoftwaredevelopment.nl;

    access_log /var/log/nginx/mortgage2go.access.log;
    error_log  /var/log/nginx/mortgage2go.error.log;

    # Certbot's webroot challenge, if ever run without --nginx. Harmless
    # otherwise, and it keeps renewals working when the rest is a redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything is one container: it serves the SPA and answers /api on the
    # same origin, which is what the wallet button requires.
    location / {
        proxy_pass http://127.0.0.1:7020;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # After certbot this reads "https", which is what the app should see.
        proxy_set_header X-Forwarded-Proto $scheme;

        # A disclosure round trip goes on to NB Wallet Connect and the
        # verification server, so allow more than the 60s default.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    # Vite fingerprints these, so they can be cached hard. The container sets
    # its own validators too; this just avoids the revalidation round trip.
    location /assets/ {
        proxy_pass http://127.0.0.1:7020;
        proxy_set_header Host $host;

        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx replaces rather than merges add_header when a location declares
        # its own, so the security headers below do not reach these responses.
        # Fine for fingerprinted JS/CSS; repeat them here if you want them
        # everywhere.
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
